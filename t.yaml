services:
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=secret123
      - MYSQL_DATABASE=blog
    volumes:
      - db_data:/var/lib/mysql
  blog:
    image: wordpress:latest
    ports:
      - "80:80"
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=secret123
      - WORDPRESS_DB_NAME=blog
    depends_on:
      - db   